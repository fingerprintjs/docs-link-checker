name: 'Setup Environment'
description: 'Sets up Node.js environment with pnpm and Playwright'
# https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action

inputs:
  app_id:
    description: 'GitHub App ID'
    required: true
  app_private_key:
    description: 'GitHub App private key'
    required: true

outputs:
  gh_token:
    description: "GitHub token for authentication"
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: 'Install pnpm'
      uses: pnpm/action-setup@129abb77bf5884e578fcaf1f37628e41622cc371
      with:
        version: 10

    - name: Install node modules
      shell: bash
      run: pnpm install --prefer-offline --frozen-lockfile

    - name: 'Get token for the GitHub App'
      uses: actions/create-github-app-token@f2acddfb5195534d487896a656232b016a682f3c
      id: app-token
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}

    - name: Check GitHub rate limit
      shell: bash
      run: pnpm run gh-limit
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}

    - name: Get installed Playwright version (used in cache key)
      shell: bash
      run: echo "PLAYWRIGHT_VERSION=$(node -e "process.stdout.write(require('playwright/package.json').version)")" >> $GITHUB_ENV

    - name: Cache Chromium browser binary
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chrome-${{ env.PLAYWRIGHT_VERSION }}

    - name: Install Chromium browser binary if cache missed
      shell: bash
      run: npx playwright install --with-deps chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
