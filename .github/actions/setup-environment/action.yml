name: "Setup Environment"
description: "Sets up Node.js environment with pnpm and Playwright"
# https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action

inputs:
  app_id:
    description: "GitHub App ID"
    required: false
  # Empty on pull requests from forks, they get no secrets
  app_private_key:
    description: "GitHub App private key. Without it, `gh_token` is the workflow token (lower rate limit)."
    required: false

outputs:
  gh_token:
    description: "GitHub token for authentication"
    value: ${{ steps.app-token.outputs.token || github.token }}

runs:
  using: "composite"
  steps:
    - name: "Install pnpm"
      # Version is read from the `packageManager` field in package.json
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: "Setup Node.js"
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: Install node modules
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: "Get token for the GitHub App"
      if: inputs.app_private_key != ''
      # Org-wide on purpose: `github-org` lists and reads every repo of the org. Not scoped with `permission-*` inputs
      # yet: the App's granted permissions are unknown here, and asking for one it lacks fails this step.
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
      id: app-token
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]

    - name: "Use the workflow token without the GitHub App key"
      if: inputs.app_private_key == ''
      shell: bash
      run: echo "::notice::No GitHub App private key (pull request from a fork?), using the workflow token."

    # Only for the App token. The workflow token has a lower quota, a low one should end in "could not check"
    # results, not block the offline checks.
    - name: Check GitHub rate limit
      if: inputs.app_private_key != ''
      shell: bash
      run: pnpm run gh-limit
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}

    - name: Get installed Playwright version (used in cache key)
      id: playwright-version
      shell: bash
      # `createRequire` resolves the package like `require` does, and works regardless of the package's module type
      run: echo "version=$(node -p "require('node:module').createRequire(process.cwd() + '/package.json')('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Chromium browser binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chrome-${{ steps.playwright-version.outputs.version }}

    - name: Install Chromium browser binary if cache missed
      shell: bash
      run: npx playwright install --with-deps chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
