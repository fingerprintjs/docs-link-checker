name: Run Unit tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      # Lint, formatting and import order (fails on any difference, never writes)
      - name: Run Biome
        run: pnpm exec biome ci

      - name: Run type check
        run: pnpm run tsc

      # Offline, no network or GH_TOKEN needed
      - name: Run unit tests
        run: pnpm run test

      # Hit real websites and the GitHub API. Runs even if unit tests fail, so both results are visible.
      - name: Run integration tests
        if: ${{ !cancelled() }}
        run: pnpm run test:integration
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}