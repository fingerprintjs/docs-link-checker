name: Run Unit tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run type check
        run: pnpm run tsc

      - name: Run unit tests
        run: pnpm run test
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}