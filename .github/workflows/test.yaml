name: Run Unit tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment

      - name: Run type check
        run: pnpm run tsc

      - name: Run unit tests
        run: pnpm run test