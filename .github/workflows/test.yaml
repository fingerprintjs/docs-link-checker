name: Run Unit tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      # Formatting and import order (fails on any difference, never writes)
      - name: Check formatting
        run: pnpm run format:check

      # Includes type-aware rules (oxlint-tsgolint), warnings fail too
      - name: Run linter
        run: pnpm run lint

      - name: Run type check
        run: pnpm run tsc

      # Unused files, exports and dependencies
      - name: Run knip
        run: pnpm run knip

      # Offline, no network or GH_TOKEN needed. Fails when coverage drops below the thresholds in vitest.config.js.
      - name: Run unit tests
        run: pnpm run test:coverage

      # Hit real websites and the GitHub API. Runs even if unit tests fail, so both results are visible.
      # Not on pull requests from forks: the workflow token's quota is shared by the repository and can run out.
      - name: Run integration tests
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: pnpm run test:integration
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}

      # Known vulnerabilities in all dependencies, dev tools included. A new advisory fails PRs that don't touch dependencies.
      # Last and after any failure, so an advisory never hides test results.
      - name: Run dependency audit
        if: ${{ !cancelled() }}
        run: pnpm audit
