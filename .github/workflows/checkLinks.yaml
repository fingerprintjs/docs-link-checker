name: Check links
on:
  # Pull request to main
  pull_request:
    branches:
      - main
  # Push to main
  push:
    branches:
      - main
  # schedule:
  #   - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch:

permissions:
  contents: read

env:
  # On pull requests, broken links in external docs must not fail the check (CI should reflect this repo's health).
  # On push to main and manual runs, broken links fail the run.
  FAIL_ON_BROKEN_LINKS: ${{ github.event_name != 'pull_request' }}
  DEV_REPORT: dev-fingerprint-com.html
  GITHUB_REPORT: fingerprintjs-github-readmes.html
  WEB_REPORT: fingerprint-com.html

jobs:
  docs:
    name: dev.fingerprint.com
    timeout-minutes: 15
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      
      - name: Run link checker
        run: pnpm run checkLinks:docs
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.DEV_REPORT }}
          path: results/${{ env.DEV_REPORT }}
          retention-days: 30

  githubReadmes:
    name: public GitHub READMEs in `fingerprintjs` org
    timeout-minutes: 15
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      
      - name: Run link checker
        run: pnpm run checkLinks:github
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.GITHUB_REPORT }}
          path: results/${{ env.GITHUB_REPORT }}
          retention-days: 30

  web:
    name: fingerprint.com (just links to our resources)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      
      - name: Run link checker
        run: pnpm run checkLinks:web
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.WEB_REPORT }}
          path: results/${{ env.WEB_REPORT }}
          retention-days: 30

  combine-artifacts:
    name: Combine all reports
    needs: [docs, githubReadmes, web]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: '*.html'
          path: reports
          merge-multiple: true
      - name: Create combined archive
        id: archive
        run: |
          mkdir -p reports
          if [ -z "$(ls -A reports)" ]; then
            echo "::warning::No reports were generated, skipping combined archive."
            exit 0
          fi
          cd reports
          zip -r ../combined-reports.zip ./*
          echo "created=true" >> "$GITHUB_OUTPUT"
          
      - name: Upload combined artifact
        if: steps.archive.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: combined-reports
          path: combined-reports.zip
          retention-days: 30

  deploy:
    name: Deploy reports to GitHub Pages
    needs: [docs, githubReadmes, web]
    runs-on: ubuntu-latest
    # Never deploy from pull requests, only from main (push) or manual runs.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: '*.html'
          path: reports
          merge-multiple: true

      - name: Create index page
        id: index
        run: |
          # Deploy only complete runs: if any report is missing (e.g. a checker crashed),
          # keep the last complete site on GitHub Pages instead of replacing it with a partial one.
          mkdir -p reports
          REPORT_ITEMS=""
          MISSING=""
          for entry in "${DEV_REPORT}|dev.fingerprint.com Report" "${GITHUB_REPORT}|GitHub READMEs Report" "${WEB_REPORT}|fingerprint.com Report"; do
            file="${entry%%|*}"
            title="${entry#*|}"
            if [ -f "reports/${file}" ]; then
              REPORT_ITEMS="${REPORT_ITEMS}<div class=\"report-item\"><a href=\"${file}\">${title}</a></div>"
            else
              MISSING="${MISSING} ${file}"
            fi
          done
          if [ -n "${MISSING}" ]; then
            echo "::warning::Missing reports:${MISSING}. Skipping deployment to keep the last complete reports on GitHub Pages."
            exit 0
          fi
          echo "has_reports=true" >> "$GITHUB_OUTPUT"
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
          cat > reports/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Link Checker Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              h1 { color: #333; }
              .report-list { margin-top: 20px; }
              .report-item { margin: 10px 0; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Link Checker Reports</h1>
            <div>
              <a href="https://github.com/fingerprintjs/docs-link-checker">Github repository</a>
              <a href="https://github.com/fingerprintjs/docs-link-checker/actions/workflows/checkLinks.yaml">Run workflow again</a>
            </div>
            <div class="report-list">
              ${REPORT_ITEMS}
            </div>
            <p>Last updated: ${TIMESTAMP}</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        if: steps.index.outputs.has_reports == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.index.outputs.has_reports == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

      - name: Deploy to GitHub Pages
        if: steps.index.outputs.has_reports == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
