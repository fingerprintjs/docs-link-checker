name: Check links
on:
  # Pull request to main
  pull_request:
    branches:
      - main
  # Push to main
  push:
    branches:
      - main
  # Every day at 03:17 UTC (off-peak minute, scheduled runs at the top of the hour are often delayed)
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Broken links in external sites are reported (summary, artifacts, Pages) but never fail the workflow.
  # Jobs fail only when the checker crashes or misconfigures (exit code 1/2 for those cases).
  FAIL_ON_BROKEN_LINKS: "false"
  # On pull requests, check only a deterministic 10% sample of pages/READMEs to keep CI fast. Check everything otherwise.
  LINK_CHECK_SAMPLE_RATE: ${{ github.event_name == 'pull_request' && '0.1' || '1' }}
  # Report names without extension: results/<name>.html and results/<name>.json, also on GitHub Pages
  DOCS_REPORT: docs-fingerprint-com
  GITHUB_REPORT: fingerprintjs-github-readmes
  WEB_REPORT: fingerprint-com
  PAGES_URL: https://fingerprintjs.github.io/docs-link-checker
  # The reports link back to the Pages index of all reports
  LINK_CHECK_INDEX_URL: https://fingerprintjs.github.io/docs-link-checker/

jobs:
  docs:
    name: docs.fingerprint.com
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      # The reports of the previous deployment, to show what changed. A missing one (first run) is fine.
      - name: Download previous report
        run: curl -fsSL -o previous.json "$PAGES_URL/${{ env.DOCS_REPORT }}.json" || echo "No previous report."

      - name: Run link checker
        run: pnpm run checkLinks:docs
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}
          # Pull requests check a 10% sample, comparing it with the full report would show most links as fixed
          LINK_CHECK_COMPARE: ${{ github.event_name != 'pull_request' && 'previous.json' || '' }}

      - name: Upload reports
        id: upload
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ env.DOCS_REPORT }}
          path: |
            results/${{ env.DOCS_REPORT }}.html
            results/${{ env.DOCS_REPORT }}.json
          retention-days: 30

      - name: Link report in job summary
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "[Download report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"

  githubReadmes:
    name: public GitHub READMEs in `fingerprintjs` org
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      # The reports of the previous deployment, to show what changed. A missing one (first run) is fine.
      - name: Download previous report
        run: curl -fsSL -o previous.json "$PAGES_URL/${{ env.GITHUB_REPORT }}.json" || echo "No previous report."

      - name: Run link checker
        run: pnpm run checkLinks:github
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}
          # Pull requests check a 10% sample, comparing it with the full report would show most links as fixed
          LINK_CHECK_COMPARE: ${{ github.event_name != 'pull_request' && 'previous.json' || '' }}

      - name: Upload reports
        id: upload
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ env.GITHUB_REPORT }}
          path: |
            results/${{ env.GITHUB_REPORT }}.html
            results/${{ env.GITHUB_REPORT }}.json
          retention-days: 30

      - name: Link report in job summary
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "[Download report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: fingerprint.com (just links to our resources)
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      # The reports of the previous deployment, to show what changed. A missing one (first run) is fine.
      - name: Download previous report
        run: curl -fsSL -o previous.json "$PAGES_URL/${{ env.WEB_REPORT }}.json" || echo "No previous report."

      - name: Run link checker
        run: pnpm run checkLinks:web
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh_token }}
          # Pull requests check a 10% sample, comparing it with the full report would show most links as fixed
          LINK_CHECK_COMPARE: ${{ github.event_name != 'pull_request' && 'previous.json' || '' }}

      - name: Upload reports
        id: upload
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ env.WEB_REPORT }}
          path: |
            results/${{ env.WEB_REPORT }}.html
            results/${{ env.WEB_REPORT }}.json
          retention-days: 30

      - name: Link report in job summary
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "[Download report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"

  combine-artifacts:
    name: Combine all reports
    needs: [docs, githubReadmes, web]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}

    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: "report-*"
          path: reports
          merge-multiple: true
      - name: Create combined archive
        id: archive
        run: |
          mkdir -p reports
          if [ -z "$(ls -A reports)" ]; then
            echo "::warning::No reports were generated, skipping combined archive."
            exit 0
          fi
          cd reports
          zip -r ../combined-reports.zip ./*
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload combined artifact
        if: steps.archive.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: combined-reports
          path: combined-reports.zip
          retention-days: 30

  deploy:
    name: Deploy reports to GitHub Pages
    needs: [docs, githubReadmes, web]
    runs-on: ubuntu-latest
    # Never deploy from pull requests, only from main (push) or manual runs.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: "report-*"
          path: reports
          merge-multiple: true

      - name: Create index page
        id: index
        run: |
          # Deploy only complete runs: if any report is missing (e.g. a checker crashed),
          # keep the last complete site on GitHub Pages instead of replacing it with a partial one.
          mkdir -p reports
          MISSING=""
          for name in "$DOCS_REPORT" "$GITHUB_REPORT" "$WEB_REPORT"; do
            for ext in html json; do
              [ -f "reports/${name}.${ext}" ] || MISSING="${MISSING} ${name}.${ext}"
            done
          done
          if [ -n "${MISSING}" ]; then
            echo "::warning::Missing reports:${MISSING}. Skipping deployment to keep the last complete reports on GitHub Pages."
            exit 0
          fi
          echo "has_reports=true" >> "$GITHUB_OUTPUT"
          node --input-type=module - "$DOCS_REPORT" "$GITHUB_REPORT" "$WEB_REPORT" <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const esc = (value) => String(value).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
          const number = (value) => value.toLocaleString("en-US");
          const rows = process.argv.slice(2).map((name) => {
            const { siteName, summary, diff, generatedAt } = JSON.parse(readFileSync(`reports/${name}.json`, "utf8"));
            const toFix = summary.totalLinksToFix;
            const status = `<td><span class="g ${toFix ? "bad" : "ok"}" aria-hidden="true">●</span>${toFix ? `${toFix} to fix` : "OK"}`;
            const trend = diff ? `+${diff.new} / −${diff.fixed}` : "";
            const time = generatedAt ? new Date(generatedAt).toISOString().slice(0, 16).replace("T", " ") + " UTC" : "";
            return `<tr><td><a href="${esc(name)}.html">${esc(siteName)}</a></td>${status}</td><td class="n">${number(summary.ignored)}</td><td class="n">${number(summary.linksChecked)}</td><td class="n">${trend}</td><td>${time}</td></tr>`;
          });
          writeFileSync("reports/index.html", `<!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width">
          <title>Link check reports</title>
          <style>
            :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --line: #d8dee4; --bg: #fff; --bad: #c62828; --ok: #1a7f37; }
            @media (prefers-color-scheme: dark) { :root { --fg: #d8dee4; --muted: #9198a1; --line: #30363d; --bg: #0d1117; --bad: #ff7b72; --ok: #56d364; } }
            body { font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); max-width: 52rem; margin: 1.5rem auto; padding: 0 1rem; }
            h1 { font-size: 15px; font-weight: 600; margin: 0 0 .75rem; }
            table { border-collapse: collapse; width: 100%; }
            th, td { padding: .25rem .75rem .25rem 0; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
            th { font-weight: 600; }
            .n { text-align: right; font-variant-numeric: tabular-nums; }
            .g { margin-right: 4px; }
            .bad { color: var(--bad); }
            .ok { color: var(--ok); }
            a { color: inherit; }
            a:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
            p { margin: .75rem 0 0; color: var(--muted); }
          </style>
          <h1>Link check reports</h1>
          <table>
            <tr><th>Report<th>Status<th class="n">Ignored<th class="n">Checked<th class="n" title="new / fixed since the previous report">Diff<th>Generated</tr>
            ${rows.join("\n")}
          </table>
          <p><a href="https://github.com/fingerprintjs/docs-link-checker">Repository</a> · <a href="https://github.com/fingerprintjs/docs-link-checker/actions/workflows/checkLinks.yaml">Run again</a></p>
          `);
          EOF

      - name: Setup Pages
        if: steps.index.outputs.has_reports == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.index.outputs.has_reports == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

      - name: Deploy to GitHub Pages
        if: steps.index.outputs.has_reports == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    name: Notify Slack
    needs: [deploy]
    # After the deploy: the message links to the new reports, and they are the base of the next comparison.
    # Never for pull requests (no deploy).
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: "report-*"
          path: reports
          merge-multiple: true

      - name: Write the Slack message
        run: pnpm exec tsx scripts/slack_message.ts "reports/$DOCS_REPORT.json" "reports/$GITHUB_REPORT.json" "reports/$WEB_REPORT.json"

      - name: Send the Slack message
        if: hashFiles('slack-payload.json') != ''
        env:
          # Incoming webhook of the channel or DM to notify
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::The SLACK_WEBHOOK_URL secret is not set, skipping the Slack message."
            exit 0
          fi
          curl -fsS -X POST -H "Content-Type: application/json" --data @slack-payload.json "$SLACK_WEBHOOK_URL"
